name: Android CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    name: Code Check, Test & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: 🧹 Run Spotless Apply
        run: ./gradlew spotlessApply --no-daemon
        continue-on-error: true 
        
      - name: 🧹 Run Spotless Check
        run: ./gradlew spotlessCheck --no-daemon
        continue-on-error: true

      - name: 🧪 Run Unit Tests
        run: ./gradlew testDebugUnitTest --no-daemon

      # PERBAIKAN 1: Tambahkan --no-daemon dan alokasi memori JVM agar tidak Out of Memory
      - name: 📦 Build APK Variants (Debug & Release)
        run: ./gradlew assembleDebug assembleRelease --stacktrace --no-daemon -Dorg.gradle.jvmargs="-Xmx4g"

      # PERBAIKAN 2: Gunakan pola /**/ untuk mencari di dalam subfolder hasil split APK
      - name: 📤 Upload Debug APK (arm64-v8a)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screen-translator-debug-arm64
          path: app/build/outputs/apk/debug/**/*arm64-v8a.apk
          retention-days: 7

      - name: 📤 Upload Release APK (arm64-v8a)
        uses: actions/upload-artifact@v4
        with:
          name: screen-translator-release-arm64
          path: app/build/outputs/apk/release/**/*arm64-v8a.apk
          retention-days: 30

      # PERBAIKAN 3: Tambahkan langkah upload untuk Universal APK (Release)
      - name: 📤 Upload Release APK (Universal)
        uses: actions/upload-artifact@v4
        with:
          name: screen-translator-release-universal
          path: app/build/outputs/apk/release/**/*universal.apk
          retention-days: 30
