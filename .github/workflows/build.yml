name: Android CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
    tags-ignore:
      - '**' 
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    name: Code Check, Test & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: 🧹 Run Spotless Apply
        run: ./gradlew spotlessApply --no-daemon
        continue-on-error: true 
        
      - name: 🧹 Run Spotless Check
        run: ./gradlew spotlessCheck --no-daemon
        continue-on-error: true

      - name: 🧪 Run Unit Tests
        run: ./gradlew testDebugUnitTest --no-daemon

      # PERBAIKAN BARU: Decode Base64 Keystore dari GitHub Secrets ke folder app/build/
      - name: 🔐 Decode Keystore
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
        run: |
          mkdir -p app/build
          echo "$SIGNING_KEY" | base64 --decode > app/build/env-signing.jks

      # PERBAIKAN: Teruskan environment variables dari GitHub Secrets ke Gradle
      - name: 🚀 Build APK Variants (Debug & Release)
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          ALIAS: ${{ secrets.ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleDebug assembleRelease --stacktrace --no-daemon -Dorg.gradle.jvmargs="-Xmx4g"

      - name: 📦 Upload Debug APK (arm64-v8a)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screen-translator-debug-arm64
          path: app/build/outputs/apk/debug/**/*arm64-v8a.apk
          retention-days: 7

      - name: 📦 Upload Release APK (arm64-v8a)
        uses: actions/upload-artifact@v4
        with:
          name: screen-translator-release-arm64
          path: app/build/outputs/apk/release/**/*arm64-v8a.apk
          retention-days: 30

      - name: 📦 Upload Release APK (Universal)
        uses: actions/upload-artifact@v4
        with:
          name: screen-translator-release-universal
          path: app/build/outputs/apk/release/**/*universal.apk
          retention-days: 30
