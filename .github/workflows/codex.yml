name: Codex DB Fixer

on:
  workflow_dispatch:
  push:
    paths:
      - "prompt.md"

permissions:
  contents: read

jobs:
  codex-run:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version-file: .github/.java-version
          distribution: temurin

      - uses: gradle/actions/setup-gradle@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Codex CLI
        run: npm install -g @openai/codex

      - name: Configure Codex
        # Membangun file config.toml secara dinamis menggunakan GitHub Secrets
        run: |
          mkdir -p ~/.codex
          cat << EOF > ~/.codex/config.toml
          model = "gpt-5.6-sol"
          model_provider = "agentrouter"

          [model_providers.agentrouter]
          name = "AgentRouter"
          base_url = "https://ps.air-outer.com/v1"
          wire_api = "responses"
          experimental_bearer_token = "sk-1BOhosptLV2kztUELb9PhjjvYyIkIhqf7EYFbseS984Kb3FL"
          EOF

      - name: Check Codex Version
        run: codex --version

      - name: Run Codex
        run: |
          if [ ! -f prompt.md ]; then
            echo "Error: prompt.md tidak ditemukan!"
            exit 1
          fi

          # Cukup pakai 1 flag pamungkas ini aja sebelum 'exec'
          codex --dangerously-bypass-approvals-and-sandbox exec "$(cat prompt.md)" 2>&1 | tee ai-response-recap.txt || true

      - name: Collect changed files and AI recap
        run: |
          git add -A

          mkdir -p output_artifact
          
          # Buat file kosong untuk mencatat file yang dihapus
          touch output_artifact/deleted_files.txt

          # Loop semua file yang berubah, ditambah, atau dihapus
          for file in $(git diff --cached --name-only); do
            if [ -f "$file" ]; then
              # Jika file ada (ditambah/diubah), copy ke artifact
              mkdir -p "output_artifact/$(dirname "$file")"
              cp "$file" "output_artifact/$file"
            else
              # Jika file tidak ada (dihapus), catat namanya
              echo "$file" >> output_artifact/deleted_files.txt
            fi
          done

          # Memasukkan file recap respons AI
          if [ -f ai-response-recap.txt ]; then
            cp ai-response-recap.txt output_artifact/ai-response-recap.txt
          fi

      # --- INI ADALAH BAGIAN YANG SEBELUMNYA HILANG ---
      - uses: actions/upload-artifact@v4
        with:
          name: opencode-output-${{ github.sha }}
          path: output_artifact/
