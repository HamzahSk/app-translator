name: OpenCode DB Fixer

on:
  workflow_dispatch:
  
  push:
    paths:
      - "prompt.md"

permissions:
  contents: read

jobs:
  opencode:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version-file: .github/.java-version
          distribution: temurin

      - uses: gradle/actions/setup-gradle@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install OpenCode
        run: npm install -g opencode-ai

      - name: Check OpenCode
        run: |
          opencode --version

      - name: Run OpenCode
        run: |
          # Menjalankan OpenCode dan menyimpan log terminal ke file
          opencode run \
            --model opencode/deepseek-v4-flash-free \
            --auto \
            "$(cat prompt.md)" 2>&1 | tee ai-response-recap.txt || true

      - name: Collect changed files and AI recap
        run: |
          git add -A

          mkdir -p output_artifact
          
          # Buat file kosong untuk mencatat file yang dihapus
          touch output_artifact/deleted_files.txt

          # Loop semua file yang berubah, ditambah, atau dihapus
          for file in $(git diff --cached --name-only); do
            if [ -f "$file" ]; then
              # Jika file ada (ditambah/diubah), copy ke artifact
              mkdir -p "output_artifact/$(dirname "$file")"
              cp "$file" "output_artifact/$file"
            else
              # Jika file tidak ada (dihapus), catat namanya
              echo "$file" >> output_artifact/deleted_files.txt
            fi
          done

          # Memasukkan file recap respons AI
          if [ -f ai-response-recap.txt ]; then
            cp ai-response-recap.txt output_artifact/ai-response-recap.txt
          fi
