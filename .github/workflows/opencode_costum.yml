name: OpenCode DB Fixer

on:
  workflow_dispatch:
  push:
    paths:
      - "prompt.md"

permissions:
  contents: read

jobs:
  opencode:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version-file: .github/.java-version
          distribution: temurin

      - uses: gradle/actions/setup-gradle@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install OpenCode
        run: npm install -g opencode-ai

      - name: Check OpenCode
        run: opencode --version

      - name: Run OpenCode
        # Mendefinisikan environment variables di sini
        env:
          # Pastikan API key disimpan di GitHub Secrets agar aman!
          API_KEY: "sk-5HXqrBXtQd477fLMICt30OfcNHBlQSyOpQU0gKY7RniiZl5l"
          # Mengatur custom URL untuk konfigurasi model
          OPENCODE_MODELS_URL: "https://ai.kscsnkli.site" 
        run: |
          # Flag --model digunakan untuk menentukan model kustom
          opencode run \
            --model provider/auto \
            --auto \
            "$(cat prompt.md)" 2>&1 | tee ai-response-recap.txt || true

      - name: Collect changed files and AI recap
        run: |
          git add -A

          mkdir -p output_artifact

          # Menyalin semua file proyek yang diubah oleh AI
          for file in $(git diff --cached --name-only); do
            if [ -f "$file" ]; then
              mkdir -p "output_artifact/$(dirname "$file")"
              cp "$file" "output_artifact/$file"
            fi
          done

          # Memasukkan file recap respons AI ke dalam artifact baru
          if [ -f ai-response-recap.txt ]; then
            cp ai-response-recap.txt output_artifact/ai-response-recap.txt
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: opencode-output-${{ github.sha }}
          path: output_artifact/
