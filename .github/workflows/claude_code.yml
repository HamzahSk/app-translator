name: OMP DB Fixer & Auto-Test Pipeline

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "prompt.md"
      
permissions:
  contents: read

jobs:
  # JOB 1: Menjalankan OMP AI dan membuat artifact source code
  omp_ai:
    name: Let OMP Fix DB History
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version-file: .github/.java-version
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install OMP
        run: curl -fsSL https://omp.sh/install | sh

      - name: Run OMP to Fix and Verify
        env:
          # PERBAIKAN: Gunakan GitHub Secrets untuk keamanan, jangan di-hardcode
          HCNSEC_API_KEY: "sk-GUWsLR2rd2tuxXP6Nzkux2kVQIZxfuLRPCzO6rx8xwTUJQiI"
        run: |
          mkdir -p ~/.omp/agent
          
          # --- MEMBUAT CONFIG MODELS.YML SESUAI DOKUMEN RESMI OMP ---
          cat << 'EOF' > ~/.omp/agent/models.yml
          providers:
            hcnsec_proxy:
              baseUrl: "https://openai-b922.onrender.com/v1"
              apiKey: HCNSEC_API_KEY
              api: openai-completions
              models:
                - id: MiniMax-M3
                  name: Proxy MiniMax-M3 Model
          EOF
          
          # --- JALANKAN OMP ---
          omp --model hcnsec_proxy/MiniMax-M3 -p "$(cat prompt.md)" || true

      - name: Collect changed files and AI recap
        run: |
          git add -A

          mkdir -p output_artifact
          
          touch output_artifact/deleted_files.txt

          for file in $(git diff --cached --name-only); do
            if [ -f "$file" ]; then
              mkdir -p "output_artifact/$(dirname "$file")"
              cp "$file" "output_artifact/$file"
            else
              echo "$file" >> output_artifact/deleted_files.txt
            fi
          done

          if [ -f ai-response-recap.txt ]; then
            cp ai-response-recap.txt output_artifact/ai-response-recap.txt
          fi

      - name: Upload AI Source Artifact
        uses: actions/upload-artifact@v4
        with:
          name: opencode-output-${{ github.sha }}
          path: output_artifact/

  # JOB 2: Mengunduh artifact dan melakukan build Android
  build_app:
    name: Build Modified App
    needs: omp_ai
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Base Code
        uses: actions/checkout@v4

      - name: Download AI Artifact
        uses: actions/download-artifact@v4
        with:
          name: opencode-output-${{ github.sha }}
          path: ai_changes

      - name: Apply AI Changes to Code
        run: |
          if [ -f ai_changes/deleted_files.txt ]; then
            while IFS= read -r file; do
              rm -f "$file"
            done < ai_changes/deleted_files.txt
            rm ai_changes/deleted_files.txt
          fi
          
          cp -a ai_changes/. ./
          rm -rf ai_changes

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build Debug APK
        run: ./gradlew assembleRelease --stacktrace --no-daemon -Dorg.gradle.jvmargs="-Xmx4g"

      - name: Upload release APK (arm64-v8a)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screen-translator-release-arm64
          path: app/build/outputs/apk/release/**/*arm64-v8a.apk
          retention-days: 7
