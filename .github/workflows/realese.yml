name: Android Release Publisher

on:
  push:
    tags:
      - 'v*' # Workflow otomatis jalan kalau kamu push tag dengan awalan 'v', contoh: v1.1.2

jobs:
  release:
    name: Build & Upload to GitHub Releases
    runs-on: ubuntu-latest
    permissions:
      contents: write # Wajib ada untuk memberi izin GitHub Actions membuat Release

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: 🔐 Decode Keystore
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
        run: |
          mkdir -p app/build
          # Decode keystore agar APK bisa di-sign dengan key dari secrets[span_1](start_span)[span_1](end_span)[span_2](start_span)[span_2](end_span)
          echo "$SIGNING_KEY" | base64 --decode > app/build/env-signing.jks

      - name: 🚀 Build Release APK Variants
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          ALIAS: ${{ secrets.ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        # Build khusus versi release, tidak usah buang waktu build debug[span_3](start_span)[span_3](end_span)
        run: ./gradlew assembleRelease --stacktrace --no-daemon -Dorg.gradle.jvmargs="-Xmx4g"

      - name: 📦 Create GitHub Release & Upload APKs
        uses: softprops/action-gh-release@v2
        with:
          # Ambil semua file APK release yang ada di folder output, termasuk split APK dan universal[span_4](start_span)[span_4](end_span)
          files: app/build/outputs/apk/release/**/*.apk
          # Otomatis buat Release Notes berdasarkan PR atau commit terbaru
          generate_release_notes: true
